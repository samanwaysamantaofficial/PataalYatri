name: Deploy site

# Every push to main: list the art, shrink it for the tunnel, publish site/.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # sharp makes the small tunnel copies. If the install fails the build
      # still succeeds and the tunnel loads the originals instead.
      - name: Install image tools
        run: npm install --no-audit --no-fund --no-package-lock
        continue-on-error: true

      - name: List the art and make small copies
        run: node tools/build-art.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
