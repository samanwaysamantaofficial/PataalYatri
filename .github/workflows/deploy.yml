name: Deploy site

# Every push to master: build dist/ from content.json, art/ and src/, then publish it.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # sharp shrinks the art. If the install fails the build still
      # succeeds and the originals are published instead.
      - name: Install image tools
        run: npm install --no-audit --no-fund --no-package-lock
        continue-on-error: true

      # Stops here, with the reason in the log, if content.json has a mistake.
      - name: Build the site
        run: node tools/build.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
