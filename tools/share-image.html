<!DOCTYPE html>
<!--
  Generator for src/assets/icons/share.jpg, the 1200x630 Open Graph image.
  Embers are a seeded simulation, so the same seed always draws the same image.
  Change `seed` in the script for a different spark pattern.

  Render (from the repo root, PowerShell):
    & "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu `
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 `
      --virtual-time-budget=5000 --allow-file-access-from-files `
      --screenshot="$PWD\share.png" "file:///$($PWD -replace '\\','/')/tools/share-image.html"
  then save share.png as src/assets/icons/share.jpg (JPEG, quality 90).

  Anek Devanagari is not part of the site, so it loads from Google Fonts: render with a network connection.
-->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Anek Bangla";font-weight:100 800;font-stretch:75% 125%;src:url("../src/assets/fonts/anek-bangla-bengali.woff2") format("woff2");unicode-range:U+0980-09FE,U+200C-200D,U+25CC;}
@font-face{font-family:"Anek Bangla";font-weight:100 800;font-stretch:75% 125%;src:url("../src/assets/fonts/anek-bangla-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F;}
@font-face{font-family:"Anek Devanagari";font-weight:100 800;font-stretch:75% 125%;src:url("https://fonts.gstatic.com/s/anekdevanagari/v17/jVyS7nP0CGrUsxB-QiRgw0NlLaVH8C3tQRw.woff2") format("woff2");unicode-range:U+0900-097F,U+200C-200D,U+25CC;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;overflow:hidden;background:#000;}
canvas{position:absolute;inset:0;}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#E9E0D2;}
.wrap>*{text-shadow:0 0 30px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.9);}
h1{font-family:"Anek Bangla";font-weight:800;font-stretch:75%;font-size:176px;line-height:.86;letter-spacing:.01em;margin:22px 0 26px;}
.s{color:#FF6A1F;font-size:52px;font-weight:600;line-height:1.1;}
.bn{font-family:"Anek Bangla";}
.hi{font-family:"Anek Devanagari";}
</style></head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="wrap">
  <p class="s bn" lang="bn">পাতাল যাত্রী</p>
  <h1>PATAAL YATRI</h1>
  <p class="s hi" lang="hi">पाताल यात्री</p>
</div>
<script>
const W=1200,H=630,out=document.getElementById('c'),o=out.getContext('2d');
let seed=7341;const r=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
const R=(a,b)=>a+(b-a)*r();
const gauss=()=>{let u=0;for(let i=0;i<4;i++)u+=r();return (u-2)/1.15;};

// blackbody-ish ember colour: t=1 white-yellow hot, t=0 deep red
function heat(t){
  t=Math.max(0,Math.min(1,t));
  const stops=[[0,[120,18,4]],[.3,[214,58,10]],[.55,[255,118,24]],[.8,[255,186,70]],[1,[255,238,190]]];
  for(let i=1;i<stops.length;i++)if(t<=stops[i][0]){
    const [a,ca]=stops[i-1],[b,cb]=stops[i],k=(t-a)/(b-a);
    return ca.map((v,j)=>Math.round(v+(cb[j]-v)*k));
  }
  return stops[stops.length-1][1];
}

// layers: sparks drawn sharp on one canvas, then bloomed
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c;};
const sp=mk(),s=sp.getContext('2d');s.globalCompositeOperation='lighter';s.lineCap='round';s.lineJoin='round';
const bk=mk(),b=bk.getContext('2d');b.globalCompositeOperation='lighter';

// turbulent updraft: layered sine field, stands in for curl noise
const ph=[...Array(8)].map(()=>R(0,6.28));
function wind(x,y){
  return 0.55*Math.sin(y*.011+ph[0]+x*.002)+0.35*Math.sin(y*.027+ph[1]-x*.004)
        +0.22*Math.sin(y*.061+ph[2]+x*.009)+0.12*Math.sin(y*.13+ph[3]);
}

// one ember, simulated through a long exposure
function ember(depth){
  // depth 0 = near the lens (thicker, brighter), 1 = far back (fine, dim)
  let x=W/2+gauss()*W*.30, y=H+R(10,90);
  let vx=gauss()*.6, vy=-R(2.2,4.6)*(1.2-depth*.4);
  let T=R(.8,1.05);                     // starting temperature
  const cool=R(.0012,.0035), jit=R(.6,1.8), turb=R(.5,1.8);
  const ox=R(-400,400), oy=R(-400,400), wf=R(.04,.12), wa=R(.1,.45), wp=R(0,6.28);
  const pts=[];
  for(let i=0;i<520 && y>-40 && T>.05;i++){
    vx+= wind(x+ox,y+oy)*.07*turb + Math.sin(i*wf+wp)*wa*.25 + gauss()*.14*jit;
    vy+= -.012 + gauss()*.05;
    vx*=.97; vy*=.995;
    x+=vx; y+=vy; T-=cool*(1+Math.abs(vx)*.2);
    pts.push([x,y,T]);
  }
  if(pts.length<20)return;
  // the shutter only catches part of the flight
  const a=Math.floor(Math.pow(r(),1.4)*pts.length*.85), len=Math.floor((r()<.5?R(3,10):R(10,38))*(1.3-depth*.5));
  const seg=pts.slice(a,a+len); if(seg.length<4)return;
  const w=(2.0-depth*1.4)*R(.7,1.25), bright=(1.2-depth*.6)*R(.55,1);
  const flick=R(.08,.25), fph=R(0,6.28), fr=R(.25,.7);
  for(let i=1;i<seg.length;i++){
    const [x0,y0]=seg[i-1],[x1,y1,t]=seg[i];
    const f=1-flick+flick*Math.sin(i*fr+fph);           // spark flicker along the trail
    const fade=Math.min(1,i/6, (seg.length-i)/4+.2);    // soft shutter open/close
    const [cr,cg,cb]=heat(t);
    s.strokeStyle=`rgba(${cr},${cg},${cb},${Math.min(1,bright*f*fade)})`;
    s.lineWidth=w*(.6+.4*t);
    s.beginPath();s.moveTo(x0,y0);s.lineTo(x1,y1);s.stroke();
  }
}

// out-of-focus embers close to the lens: soft discs with a faint rim
function bokeh(){
  const x=W/2+gauss()*W*.38, y=H*Math.pow(r(),.45), rad=R(5,26), [cr,cg,cb]=heat(R(.35,.8)), a=R(.05,.16)*(.5+y/H);
  const g=b.createRadialGradient(x,y,0,x,y,rad);
  g.addColorStop(0,`rgba(${cr},${cg},${cb},${a*.7})`);
  g.addColorStop(.8,`rgba(${cr},${cg},${cb},${a})`);
  g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  b.fillStyle=g;b.beginPath();b.arc(x,y,rad,0,7);b.fill();
}

// --- compose ---
o.fillStyle='#000';o.fillRect(0,0,W,H);
// fire light below the frame, lighting smoke
let g=o.createRadialGradient(W/2,H+140,10,W/2,H+140,560);
g.addColorStop(0,'rgba(255,120,30,.55)');g.addColorStop(.25,'rgba(220,60,14,.22)');
g.addColorStop(.6,'rgba(90,16,6,.08)');g.addColorStop(1,'rgba(0,0,0,0)');
o.fillStyle=g;o.fillRect(0,0,W,H);
// smoke wisps catching the glow
o.globalCompositeOperation='lighter';
for(let i=0;i<26;i++){
  const x=W/2+gauss()*260,y=H-R(0,260),rx=R(60,180);
  const sg=o.createRadialGradient(x,y,0,x,y,rx);
  sg.addColorStop(0,`rgba(120,40,16,${R(.02,.05)})`);sg.addColorStop(1,'rgba(0,0,0,0)');
  o.fillStyle=sg;o.beginPath();o.ellipse(x,y,rx,rx*R(.4,.8),R(-.5,.5),0,7);o.fill();
}

for(let i=0;i<18;i++)bokeh();
for(let i=0;i<110;i++)ember(Math.pow(r(),.8));
// tiny drifting ash-embers caught as points
for(let i=0;i<90;i++){
  const x=W/2+gauss()*W*.32,y=H*Math.pow(r(),.6),[cr,cg,cb]=heat(R(.4,.95));
  s.fillStyle=`rgba(${cr},${cg},${cb},${R(.3,.9)*(.4+y/H*.6)})`;
  s.beginPath();s.arc(x,y,R(.5,1.4),0,7);s.fill();
}

// bloom: wide soft glow, tight glow, then the sharp sparks
o.filter='blur(16px)';o.globalAlpha=1;o.drawImage(sp,0,0);
o.filter='blur(5px)'; o.globalAlpha=1;o.drawImage(sp,0,0);
o.filter='blur(2px)'; o.globalAlpha=.8;o.drawImage(sp,0,0);
o.filter='blur(6px)'; o.globalAlpha=1; o.drawImage(bk,0,0);
o.filter='none';      o.globalAlpha=1; o.drawImage(sp,0,0);
o.globalCompositeOperation='source-over';

// vignette to keep the corners black
g=o.createRadialGradient(W/2,H*.6,H*.35,W/2,H*.6,W*.75);
g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');
o.fillStyle=g;o.fillRect(0,0,W,H);
</script>
</body></html>
